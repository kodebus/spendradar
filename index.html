<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spend Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg:#F6F8FB;
    --card:#FFFFFF;
    --teal:#1F6F6B;
    --teal-dark:#164F4C;
    --teal-light:#E4F1F0;
    --ink:#16233D;
    --ink-soft:#5B6B85;
    --border:#E2E8F0;
    --amber:#C97A22;
    --red:#C7473F;
    --green:#1F6F6B;
    --radius:14px;
    --display:'Space Grotesk',sans-serif;
    --body:'Inter',sans-serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;padding-bottom:60px;}
  a{color:inherit;}

  nav{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;flex-wrap:wrap;gap:10px;}
  .nav-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .nav-left{display:flex;align-items:center;gap:14px;}
  .nav-back{font-family:var(--mono);font-size:12px;color:var(--ink-soft);text-decoration:none;padding:6px 12px;border:1px solid var(--border);border-radius:8px;transition:.15s;}
  .nav-back:hover{border-color:var(--teal);color:var(--teal);}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-icon{width:30px;height:30px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;color:white;font-size:15px;}
  .brand-name{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-0.3px;}
  .settings-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-family:var(--body);font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;transition:.15s;}
  .settings-btn:hover{border-color:var(--teal);color:var(--teal);}

  .wrap{max-width:960px;margin:0 auto;padding:20px 24px 0;flex:1;min-width:0;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}

  .summary-card h2{font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:16px;}
  .cat-row{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:12px;margin-bottom:12px;}
  .cat-name{font-size:13px;font-weight:500;color:var(--ink-soft);}
  .cat-bar-track{height:8px;background:#EEF2F6;border-radius:5px;overflow:hidden;}
  .cat-bar-fill{height:100%;background:var(--teal);border-radius:5px;}
  .cat-amt{font-family:var(--mono);font-size:12.5px;text-align:right;}
  .sidebar-chart{padding:0 10px;}
  .sidebar-chart .cat-row{grid-template-columns:1fr;gap:2px;margin-bottom:10px;}
  .sidebar-chart .cat-name{font-size:11px;}
  .sidebar-chart .cat-bar-track{height:5px;}
  .sidebar-chart .cat-amt{font-size:10.5px;text-align:left;color:var(--ink-soft);}
  .sidebar-chart .empty-state{font-size:11px;padding:0;text-align:left;color:var(--ink-soft);}

  .actions-row{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;}

  .app-shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}
  .sidebar{width:210px;flex-shrink:0;padding:20px 12px 20px 24px;position:sticky;top:56px;}
  .sidebar-title{font-family:var(--display);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin:0 0 8px 10px;}
  .nav-item{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;background:none;border:none;border-radius:8px;padding:9px 10px;cursor:pointer;margin-bottom:2px;font-family:var(--body);transition:.15s;}
  .nav-item:hover{background:var(--teal-light);}
  .nav-item .nav-sub{font-size:12.5px;font-weight:500;color:var(--ink);}
  .nav-item .nav-via{font-size:10.5px;color:var(--ink-soft);}
  @media (max-width:760px){
    .app-shell{flex-direction:column;}
    .sidebar{width:100%;position:static;padding:16px 20px 0;display:flex;flex-direction:row;gap:6px;overflow-x:auto;}
    .sidebar-title{display:none;}
    .nav-item{flex-direction:row;align-items:center;gap:6px;white-space:nowrap;width:auto;}
    .nav-item .nav-via{display:none;}
  }

  .connection-card{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:6px;flex-wrap:wrap;}
  .connection-label{font-family:var(--display);font-size:14.5px;font-weight:600;}
  .connection-sub{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .connection-empty{font-size:13.5px;color:var(--ink-soft);}
  .action-btn{flex:1;min-width:150px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-family:var(--body);font-weight:500;font-size:13.5px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px;justify-content:center;transition:.15s;}
  .action-btn:hover{border-color:var(--teal);background:var(--teal-light);}
  .action-btn.primary{background:var(--teal);color:white;border-color:var(--teal);}
  .action-btn.primary:hover{background:var(--teal-dark);}

  .panel{display:none;margin-bottom:16px;}
  .panel.open{display:block;}
  .panel h3{font-family:var(--display);font-size:15px;font-weight:600;margin-bottom:14px;}
  .panel textarea{width:100%;min-height:140px;border:1px solid var(--border);border-radius:10px;padding:12px;font-family:var(--mono);font-size:12.5px;resize:vertical;}
  .panel input[type=file]{font-size:13px;}
  .panel .hint{font-size:12px;color:var(--ink-soft);margin-top:8px;}
  .panel-buttons{display:flex;gap:10px;margin-top:14px;}
  .btn-sm{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:white;font-size:13px;font-weight:500;cursor:pointer;}
  .btn-sm.primary{background:var(--teal);color:white;border-color:var(--teal);}
  .btn-sm:hover{opacity:.9;}
  .dropzone{border:2px dashed var(--border);border-radius:10px;padding:28px;text-align:center;color:var(--ink-soft);font-size:13px;cursor:text;}
  .dropzone.drag{border-color:var(--teal);background:var(--teal-light);}
  .dropzone img{max-width:100%;max-height:180px;border-radius:8px;margin-top:10px;}

  .review-list{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:14px;}
  .review-row{display:grid;grid-template-columns:24px 90px 1fr 90px 90px;gap:10px;padding:10px 14px;font-size:13px;align-items:center;border-bottom:1px solid var(--border);}
  .review-row:last-child{border-bottom:none;}
  .review-row.dup{opacity:.5;}
  .review-row .tag{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--teal-light);color:var(--teal-dark);justify-self:start;}
  .review-row .tag.dup-tag{background:#F2E7DC;color:var(--amber);}
  .review-row .amt{font-family:var(--mono);text-align:right;}

  .tx-card h2{font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
  .tx-card h2 button{font-family:var(--body);font-size:12.5px;font-weight:500;color:var(--teal);background:none;border:none;cursor:pointer;}
  .tx-row{display:grid;grid-template-columns:80px 1fr 100px 90px 30px;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--border);font-size:13.5px;}
  .tx-row.tx-header{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);font-weight:600;padding-top:0;padding-bottom:8px;}
  .tx-row.tx-header > div{cursor:pointer;user-select:none;}
  .tx-row.tx-header > div:hover{color:var(--teal);}
  .tx-row:last-child{border-bottom:none;}
  .tx-date{font-family:var(--mono);font-size:12px;color:var(--ink-soft);}
  .tx-cat{font-size:11px;font-family:var(--mono);color:var(--teal-dark);background:var(--teal-light);padding:2px 8px;border-radius:6px;justify-self:start;}
  .tx-amt{font-family:var(--mono);text-align:right;}
  .tx-source{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
  .tx-del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;padding:8px;margin:-8px;border-radius:6px;line-height:1;}
  .tx-del:hover{background:#FBE9E7;}
  .tx-del:hover{color:var(--red);}
  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13.5px;}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(22,35,61,0.45);z-index:50;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:white;border-radius:16px;padding:28px;max-width:420px;width:100%;}
  .modal h3{font-family:var(--display);font-size:17px;font-weight:600;margin-bottom:18px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-soft);margin-bottom:6px;}
  .field input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-family:var(--body);font-size:14px;}
  .modal-buttons{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="https://japps.ai" class="nav-back">← Japps.ai</a>
    <div class="brand"><div class="brand-icon">◎</div><div class="brand-name">Spend Radar</div></div>
  </div>
  <div class="nav-right">
    <button class="settings-btn" onclick="openSettings()">Settings</button>
  </div>
</nav>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-title">Import Transactions</div>
    <button class="nav-item" id="connectBankBtn" onclick="connectBank()">
      <span class="nav-sub">🏦 Connect Bank</span>
      <span class="nav-via">through Plaid</span>
    </button>
    <button class="nav-item" onclick="togglePanel('csvPanel')">
      <span class="nav-sub">📄 Upload CSV</span>
      <span class="nav-via">through CSV</span>
    </button>
    <button class="nav-item" onclick="togglePanel('pastePanel')">
      <span class="nav-sub">📋 Paste transactions</span>
      <span class="nav-via">through pasting transactions</span>
    </button>

    <div class="sidebar-title" style="margin-top:22px;">This Cycle</div>
    <div id="categoryBreakdown" class="sidebar-chart"></div>
  </aside>

  <div class="wrap">

  <div class="card" id="searchPanel" style="margin-bottom:16px;">
    <h3 style="font-family:var(--display);font-size:15px;font-weight:600;margin-bottom:14px;">Search transactions</h3>
    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;">
      <div class="field" style="margin:0;">
        <label>From</label>
        <input type="date" id="searchFrom">
      </div>
      <div class="field" style="margin:0;">
        <label>To</label>
        <input type="date" id="searchTo">
      </div>
      <div class="field" style="margin:0;">
        <label>Category</label>
        <select id="searchCategory" style="padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-family:var(--body);font-size:14px;background:white;">
          <option value="">All categories</option>
        </select>
      </div>
      <div class="field" style="margin:0;">
        <label>Brought in via</label>
        <select id="searchSource" style="padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-family:var(--body);font-size:14px;background:white;">
          <option value="">All sources</option>
        </select>
      </div>
      <button class="btn-sm primary" onclick="runSearch()">Search</button>
      <button class="btn-sm" onclick="clearSearch()">Clear</button>
    </div>
    <div id="searchStatus" style="font-size:12.5px;color:var(--ink-soft);"></div>
  </div>

  <div class="card" id="summaryCard" style="margin-bottom:16px;">
    <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center;justify-content:space-between;">
      <div id="summaryContent" style="flex:1;min-width:200px;"></div>
      <div style="display:flex;flex-direction:column;gap:8px;min-width:170px;">
        <div class="field" style="margin:0;">
          <label>Limit for this report (optional)</label>
          <div style="position:relative;">
            <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:14px;pointer-events:none;">$</span>
            <input type="text" inputmode="decimal" id="pdfLimit" placeholder="0.00" style="padding-left:22px;width:100%;" oninput="formatCurrencyInput(this)" onblur="formatCurrencyBlur(this)">
          </div>
        </div>
        <button class="btn-sm primary" onclick="downloadSearchPDF()" style="align-self:flex-start;">📄 Download PDF</button>
      </div>
    </div>
  </div>

  <div class="card connection-card" id="connectionCard" style="margin-bottom:10px;display:none;"></div>
  <div id="bankStatus" style="display:none;font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;"></div>

  <div class="panel card" id="csvPanel">
    <h3>Upload CSV</h3>
    <input type="file" id="csvInput" accept=".csv" onchange="handleCsvFile(event)"/>
    <div class="hint">Standard bank export — a Date column, a Description column, and a Debit or Amount column. Header names are auto-detected.</div>
  </div>

  <div class="panel card" id="pastePanel">
    <h3>Paste transactions</h3>
    <textarea id="pasteInput" placeholder="Paste raw text copied from your bank's activity page — works even if it runs together with no line breaks."></textarea>
    <div class="panel-buttons">
      <button class="btn-sm primary" onclick="handlePasteText()">Parse</button>
      <button class="btn-sm" onclick="togglePanel('pastePanel')">Cancel</button>
    </div>
  </div>

  <div class="panel card" id="reviewPanel">
    <h3>Review new transactions</h3>
    <div id="reviewSummary" style="font-size:13px;color:var(--ink-soft);margin-bottom:6px;"></div>
    <div style="margin-bottom:12px;">
      <button type="button" onclick="selectAllReview(true)" style="background:none;border:none;color:var(--teal);font-size:12px;font-weight:500;cursor:pointer;padding:0;margin-right:14px;">Select all</button>
      <button type="button" onclick="selectAllReview(false)" style="background:none;border:none;color:var(--teal);font-size:12px;font-weight:500;cursor:pointer;padding:0;">Select none</button>
    </div>
    <div class="panel-buttons" style="margin-top:0;margin-bottom:16px;">
      <button class="btn-sm primary" onclick="confirmReview()">Add selected transactions</button>
      <button class="btn-sm" onclick="cancelReview()">Cancel</button>
    </div>
    <div class="review-list" id="reviewList"></div>
    <div class="panel-buttons">
      <button class="btn-sm primary" onclick="confirmReview()">Add selected transactions</button>
      <button class="btn-sm" onclick="cancelReview()">Cancel</button>
    </div>
  </div>

  <div class="card tx-card">
    <h2><span id="txHeading">Transactions</span> <span><button onclick="exportTransactionsCSV()" style="margin-right:14px;">Export CSV</button><button onclick="clearAll()">Clear all</button></span></h2>
    <div id="txList"></div>
  </div>

  </div>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>Settings</h3>
    <div class="field">
      <label>Cycle reset day (day of month)</label>
      <input type="number" id="setCycle" min="1" max="31" placeholder="e.g. 1st">
    </div>
    <div class="field">
      <label>App secret (required for Connect bank — must match APP_SECRET in Vercel)</label>
      <input type="password" id="setAppSecret" placeholder="paste the same value set in Vercel">
    </div>
    <div class="modal-buttons" style="justify-content:space-between;">
      <button type="button" style="background:none;border:none;color:var(--red);font-size:12.5px;cursor:pointer;padding:0;" onclick="resetApp()">Reset everything</button>
      <div style="display:flex;gap:10px;">
        <button class="btn-sm" onclick="closeSettings()">Cancel</button>
        <button class="btn-sm primary" onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORE_KEY = 'spendradar_data_v1';
let state = load();
let pendingReview = [];

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { cycleDay:null, appSecret:'', manualMethod:null, plaidInstitution:'', plaidMask:'', transactions:[] };
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  schedulePushToServer();
}

// ---------- shared server-side state (so settings/transactions aren't stuck on one device) ----------
const SYNCED_FIELDS = ['name','limit','cycleDay','transactions','plaidInstitution','plaidMask','lastSyncedAt','manualMethod','bankLinked'];
let pushTimer = null;
function schedulePushToServer(){
  if(!state.appSecret) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushStateToServer, 800);
}
async function pushStateToServer(){
  if(!state.appSecret) return;
  const payload = {};
  SYNCED_FIELDS.forEach(f => payload[f] = state[f]);
  try{
    await fetch('/api/app-state', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-app-secret': state.appSecret },
      body: JSON.stringify(payload)
    });
  }catch(err){
    console.error('Failed to sync state to server', err);
  }
}
async function pullStateFromServer(){
  if(!state.appSecret) return false;
  try{
    const res = await fetch('/api/app-state', {
      method:'GET',
      headers:{ 'x-app-secret': state.appSecret }
    });
    if(!res.ok) return false;
    const { state: serverState } = await res.json();
    if(!serverState) return false;
    SYNCED_FIELDS.forEach(f => {
      if(serverState[f] !== undefined) state[f] = serverState[f];
    });
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
    return true;
  }catch(err){
    console.error('Failed to pull shared state from server', err);
    return false;
  }
}

function openSettings(){
  document.getElementById('setCycle').value = state.cycleDay || '';
  document.getElementById('setAppSecret').value = state.appSecret || '';
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings(){ document.getElementById('settingsModal').classList.remove('open'); }
async function saveSettings(){
  const priorSecret = state.appSecret;
  const cycleRaw = document.getElementById('setCycle').value.trim();
  const formCycleDay = cycleRaw === '' ? null : (parseInt(cycleRaw) || null);
  const appSecret = document.getElementById('setAppSecret').value.trim();

  state.appSecret = appSecret;

  // If this is the first time an App secret is entered on this device, check the server
  // first rather than overwriting existing shared data with this device's blank defaults.
  let pulledExisting = false;
  if(!priorSecret && appSecret){
    pulledExisting = await pullStateFromServer();
  }

  if(!pulledExisting){
    state.cycleDay = formCycleDay;
  }

  save();
  closeSettings();
  render();
  showToast(pulledExisting ? 'Loaded your existing settings and transactions from the server' : 'Settings saved');
}

function resetApp(){
  const ok = confirm('This clears all transactions and resets the Cycle reset day back to default. Your bank connection stays linked. This can\'t be undone. Continue?');
  if(!ok) return;
  state.cycleDay = null;
  state.transactions = [];
  state.manualMethod = null;
  // bankLinked / plaidInstitution / plaidMask are intentionally left alone — the bank stays connected
  save();
  closeSettings();
  render();
  showToast('Everything reset. Your bank connection is still linked.');
}

function togglePanel(id){
  ['csvPanel','pastePanel','reviewPanel'].forEach(p=>{
    if(p!==id) document.getElementById(p).classList.remove('open');
  });
  document.getElementById(id).classList.toggle('open');
}

// ---------- category guessing ----------
const CATEGORY_RULES = [
  ['Gas', /shell|exxon|chevron|mobil|bp |sunoco|marathon|speedway|circle k|gas station|arco|valero/i],
  ['Food', /restaurant|mcdonald|chipotle|starbucks|doordash|uber eats|grubhub|pizza|taco|cafe|coffee|chick-fil-a|wendy|subway|panera|food/i],
  ['Shopping', /amazon|walmart|target|best buy|store|mall|ebay|shein|nike|clothing/i],
  ['Entertainment', /netflix|spotify|steam|movie|cinema|hulu|disney|xbox|playstation|ticket/i],
];
function guessCategory(desc){
  for(const [cat, re] of CATEGORY_RULES){ if(re.test(desc)) return cat; }
  return 'Other';
}

// ---------- date helpers ----------
function toISO(d){
  if(!(d instanceof Date) || isNaN(d)) return null;
  return d.toISOString().slice(0,10);
}
function formatSyncedTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const timeStr = d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
  if(sameDay) return `today at ${timeStr}`;
  const dateStr = d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  return `${dateStr} at ${timeStr}`;
}
const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseShortDate(str){
  const m = str.match(/([A-Za-z]{3})\s*(\d{1,2})/);
  if(!m) return null;
  const mon = MONTHS[m[1].toLowerCase()];
  if(mon===undefined) return null;
  const day = parseInt(m[2]);
  const now = new Date();
  let year = now.getFullYear();
  const d = new Date(year, mon, day);
  if(d > now) d.setFullYear(year-1);
  return toISO(d);
}

// ---------- CSV import ----------
function handleCsvFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => parseCsv(e.target.result);
  reader.readAsText(file);
}
function parseCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  if(lines.length < 2) return showToast('CSV looks empty');
  const header = lines[0].split(',').map(h=>h.trim().toLowerCase());
  const dateIdx = header.findIndex(h=>h.includes('date'));
  const descIdx = header.findIndex(h=>h.includes('description')||h.includes('merchant')||h.includes('payee'));
  const amtIdx = header.findIndex(h=>h.includes('debit')||h.includes('amount')||h.includes('charge'));
  if(dateIdx<0 || amtIdx<0) return showToast('Could not find date/amount columns');
  const parsed = [];
  for(let i=1;i<lines.length;i++){
    const cols = lines[i].split(',').map(c=>c.trim().replace(/^"|"$/g,''));
    const rawDate = cols[dateIdx];
    const desc = descIdx>=0 ? cols[descIdx] : 'Unknown';
    let amt = parseFloat((cols[amtIdx]||'').replace(/[^0-9.-]/g,''));
    if(isNaN(amt) || amt===0) continue;
    amt = Math.abs(amt);
    const d = new Date(rawDate);
    const iso = toISO(d) || parseShortDate(rawDate);
    if(!iso) continue;
    parsed.push({date:iso, merchant:desc, amount:amt, category:guessCategory(desc), source:'CSV upload'});
  }
  if(!parsed.length) return showToast('No valid rows found');
  startReview(parsed);
  state.manualMethod = 'csv';
  save();
  renderConnectionCard();
}

// ---------- paste text import ----------
function parseLineFormat(blob){
  // Handles bank paste formats where each transaction is its own group of lines:
  //   Sep04
  //   Shell Oil
  //   Gas/Automotive...8337$40.70
  const lines = blob.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
  const dateLineRe = /^([A-Za-z]{3})\s*(\d{1,2})$/;
  const amountLineRe = /(-?\$[\d,]+\.\d{2})\s*$/;
  const results = [];
  let i = 0, matchedAny = false;
  while(i < lines.length){
    const dm = lines[i].match(dateLineRe);
    if(dm){
      const iso = parseShortDate(lines[i]);
      let j = i+1, merchantParts = [], amount = null;
      while(j < lines.length && j < i+6){
        const amtMatch = lines[j].match(amountLineRe);
        if(amtMatch){ amount = Math.abs(parseFloat(amtMatch[1].replace(/[^0-9.-]/g,''))); break; }
        merchantParts.push(lines[j]);
        j++;
      }
      if(amount !== null && iso){
        matchedAny = true;
        const merchant = merchantParts[0] || 'Unknown';
        results.push({date: iso, merchant, amount, category: guessCategory(merchant), source:'Pasted transactions'});
        i = j+1;
        continue;
      }
    }
    i++;
  }
  return matchedAny ? results : null;
}

function handlePasteText(){
  const blob = document.getElementById('pasteInput').value;
  if(!blob.trim()) return showToast('Paste some text first');

  let parsed = parseLineFormat(blob);

  if(!parsed){
    // Fallback: original whitespace-agnostic parser for formats with no line breaks at all
    const re = /([A-Za-z]{3}\s?\d{1,2})(.*?)(-?\$[\d,]+\.\d{2})/gs;
    let match; parsed = [];
    while((match = re.exec(blob)) !== null){
      const iso = parseShortDate(match[1]);
      let merchant = match[2].replace(/[\.\-_#\d\$,]{3,}/g,' ').replace(/\s+/g,' ').trim();
      if(!merchant) merchant = 'Unknown';
      const amount = Math.abs(parseFloat(match[3].replace(/[^0-9.-]/g,'')));
      if(!iso || isNaN(amount) || amount===0) continue;
      parsed.push({date:iso, merchant, amount, category:guessCategory(merchant), source:'Pasted transactions'});
    }
  }

  if(!parsed.length) return showToast('Could not find any transactions in that text');
  startReview(parsed);
  state.manualMethod = 'paste';
  save();
  renderConnectionCard();
  document.getElementById('pasteInput').value = '';
}

// ---------- bank connection (Plaid) ----------
function bankStatusEl(){ return document.getElementById('bankStatus'); }
function setBankStatus(msg){
  const el = bankStatusEl();
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

async function connectBank(){
  const btn = document.getElementById('connectBankBtn');
  if(!state.appSecret){
    setBankStatus('Set your "App secret" in Settings first — it must match the APP_SECRET env var in Vercel.');
    return;
  }
  btn.disabled = true;
  setBankStatus('Connecting to your bank…');
  try{
    const res = await fetch('/api/create-link-token', {
      method:'POST',
      headers:{ 'x-app-secret': state.appSecret }
    });
    if(!res.ok){
      const body = await res.json().catch(()=>({}));
      throw new Error(body.error || 'link token request failed');
    }
    const { link_token } = await res.json();

    const handler = Plaid.create({
      token: link_token,
      onSuccess: async (public_token, metadata) => {
        setBankStatus('Linking account…');
        try{
          const exchangeRes = await fetch('/api/exchange-public-token', {
            method:'POST',
            headers:{
              'Content-Type':'application/json',
              'x-app-secret': state.appSecret
            },
            body: JSON.stringify({ public_token })
          });
          if(!exchangeRes.ok){
            const body = await exchangeRes.json().catch(()=>({}));
            throw new Error(body.error || 'exchange failed');
          }
          state.bankLinked = true;
          state.manualMethod = null;
          state.plaidInstitution = metadata?.institution?.name || '';
          state.plaidMask = metadata?.accounts?.[0]?.mask || '';
          save();
          renderConnectionCard();
          showToast('Bank connected — syncing transactions…');
          await syncBankTransactions();
        }catch(err){
          console.error(err);
          setBankStatus('Could not finish linking your account. Try again.');
        }
      },
      onExit: (err) => {
        if(err) console.error(err);
        setBankStatus('');
      },
    });
    handler.open();
  }catch(err){
    console.error(err);
    setBankStatus('Could not reach the bank-connect service. Check that APP_SECRET matches in Vercel and Settings, and that PLAID env vars are set.');
  }finally{
    btn.disabled = false;
  }
}

async function disconnectBank(){
  if(!state.appSecret){
    setBankStatus('Set your "App secret" in Settings first.');
    return;
  }
  const ok = confirm('Disconnect this bank account? You\'ll need to link it again through Plaid before syncing works. Transactions already added won\'t be removed.');
  if(!ok) return;
  setBankStatus('Disconnecting…');
  try{
    const res = await fetch('/api/disconnect-bank', {
      method:'POST',
      headers:{ 'x-app-secret': state.appSecret }
    });
    if(!res.ok){
      const body = await res.json().catch(()=>({}));
      throw new Error(body.error || 'disconnect failed');
    }
    state.bankLinked = false;
    state.plaidInstitution = '';
    state.plaidMask = '';
    state.lastSyncedAt = null;
    save();
    renderConnectionCard();
    setBankStatus('Bank disconnected. Connect again any time from the sidebar.');
  }catch(err){
    console.error(err);
    setBankStatus('Could not disconnect. Try again.');
  }
}

async function syncBankTransactions(){
  if(!state.appSecret){
    setBankStatus('Set your "App secret" in Settings first.');
    return;
  }
  setBankStatus('Syncing latest transactions…');
  try{
    const res = await fetch('/api/sync-transactions', {
      method:'POST',
      headers:{ 'x-app-secret': state.appSecret }
    });
    if(!res.ok){
      const body = await res.json().catch(()=>({}));
      throw new Error(body.error || 'sync failed');
    }
    const { transactions } = await res.json();
    state.lastSyncedAt = new Date().toISOString();
    save();
    const syncedLabel = formatSyncedTime(state.lastSyncedAt);
    if(!transactions.length){
      setBankStatus(`No new transactions since last sync. Last checked ${syncedLabel}.`);
      return;
    }
    const bankSourceLabel = state.plaidInstitution || 'Bank';
    const parsed = transactions.map(t => ({
      date: t.date,
      merchant: t.merchant,
      amount: Math.abs(t.amount),
      category: guessCategory(t.merchant || ''),
      source: bankSourceLabel
    }));
    startReview(parsed);
    setBankStatus(`Synced ${transactions.length} transaction(s) from your bank just now (${syncedLabel}) — review below.`);
  }catch(err){
    console.error(err);
    setBankStatus('Bank sync failed. The Vercel backend, APP_SECRET, or Plaid keys may not be set up right.');
  }
}

// ---------- review / dedupe ----------
function isDuplicate(tx){
  return state.transactions.some(t => t.date===tx.date && t.merchant===tx.merchant && Math.abs(t.amount-tx.amount)<0.005);
}
function startReview(parsed){
  pendingReview = parsed.map(tx => ({...tx, dup: isDuplicate(tx), selected: !isDuplicate(tx)}));
  renderReviewList();
  ['csvPanel','pastePanel'].forEach(p=>document.getElementById(p).classList.remove('open'));
  document.getElementById('reviewPanel').classList.add('open');
  document.getElementById('reviewPanel').scrollIntoView({ behavior:'smooth', block:'start' });
}
function renderReviewList(){
  const list = document.getElementById('reviewList');
  list.innerHTML = pendingReview.map((tx,i) => `
    <div class="review-row ${tx.dup?'dup':''}">
      <input type="checkbox" ${tx.dup?'disabled':''} ${tx.selected?'checked':''} onchange="toggleReviewItem(${i})">
      <span class="tx-date">${tx.date}</span>
      <span>${escapeHtml(tx.merchant)}</span>
      <span class="${tx.dup?'tag dup-tag':'tag'}">${tx.dup?'duplicate':'new'}</span>
      <span class="amt">$${tx.amount.toFixed(2)}</span>
    </div>
  `).join('');
  updateReviewSummary();
}
function updateReviewSummary(){
  const selectedCount = pendingReview.filter(tx=>tx.selected && !tx.dup).length;
  const dupCount = pendingReview.filter(tx=>tx.dup).length;
  const eligibleCount = pendingReview.length - dupCount;
  document.getElementById('reviewSummary').textContent =
    `${selectedCount} of ${eligibleCount} transaction${eligibleCount===1?'':'s'} selected to add` +
    (dupCount ? ` · ${dupCount} duplicate${dupCount===1?'':'s'} will be skipped` : '') +
    ' — uncheck any you don\'t want, then click "Add selected transactions".';
}
function toggleReviewItem(i){
  pendingReview[i].selected = !pendingReview[i].selected;
  updateReviewSummary();
}
function selectAllReview(select){
  pendingReview.forEach(tx => { if(!tx.dup) tx.selected = select; });
  renderReviewList();
}
function confirmReview(){
  const newOnes = pendingReview.filter(tx=>tx.selected && !tx.dup);
  const skippedCount = pendingReview.length - newOnes.length;
  state.transactions.push(...newOnes.map(({dup, selected, ...rest})=>rest));
  state.transactions.sort((a,b)=> a.date < b.date ? 1 : -1);
  save();
  render();
  document.getElementById('reviewPanel').classList.remove('open');
  showToast(`Added ${newOnes.length} transaction${newOnes.length===1?'':'s'}${skippedCount ? ', skipped '+skippedCount : ''}`);
  pendingReview = [];
}
function cancelReview(){
  document.getElementById('reviewPanel').classList.remove('open');
  pendingReview = [];
}

// ---------- rendering ----------
function getCycleStartISO(refDate){
  const now = refDate || new Date();
  const cycleDay = state.cycleDay || 19;
  let start = new Date(now.getFullYear(), now.getMonth(), cycleDay);
  if(now.getDate() < cycleDay) start = new Date(now.getFullYear(), now.getMonth()-1, cycleDay);
  return toISO(start);
}
function currentCycleSpend(){
  const startISO = getCycleStartISO();
  const todayISO = toISO(new Date());
  return state.transactions.filter(t => t.date >= startISO && t.date <= todayISO);
}

function renderConnectionCard(){
  const el = document.getElementById('connectionCard');
  if(!el) return;
  if(state.bankLinked){
    const inst = state.plaidInstitution || 'your bank';
    const mask = state.plaidMask ? ` •••• ${escapeHtml(state.plaidMask)}` : '';
    const synced = state.lastSyncedAt ? `Last synced ${formatSyncedTime(state.lastSyncedAt)}` : 'Not synced yet';
    el.style.display = 'flex';
    el.innerHTML = `
      <div>
        <div class="connection-label">🏦 Connected to ${escapeHtml(inst)}${mask}</div>
        <div class="connection-sub">${synced}</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-sm primary" onclick="syncBankTransactions()">Sync now</button>
        <button class="btn-sm" onclick="disconnectBank()">Disconnect</button>
      </div>
    `;
  } else {
    el.style.display = 'none';
    el.innerHTML = '';
  }
}

function render(){
  renderConnectionCard();
  populateSearchFilters();

  const cycleTx = currentCycleSpend();

  const cats = {};
  cycleTx.forEach(t=>{ cats[t.category] = (cats[t.category]||0) + t.amount; });
  const maxCat = Math.max(...Object.values(cats), 1);
  const order = ['Gas','Food','Shopping','Entertainment','Other'];
  const catDiv = document.getElementById('categoryBreakdown');
  const present = order.filter(c=>cats[c]);
  catDiv.innerHTML = present.length ? present.map(c=>`
    <div class="cat-row">
      <div class="cat-name">${c}</div>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(cats[c]/maxCat*100).toFixed(0)}%"></div></div>
      <div class="cat-amt">$${cats[c].toFixed(2)}</div>
    </div>
  `).join('') : '<div class="empty-state">No transactions this cycle yet.</div>';

  const txDiv = document.getElementById('txList');
  const indexed = state.transactions
    .map((t,i)=>({...t, _idx:i}))
    .filter(t => matchesFilter(t, activeFilter));
  indexed.sort((a,b)=>{
    let av, bv;
    if(txSort.field === 'amount'){ av = a.amount; bv = b.amount; }
    else { av = (a[txSort.field]||'').toString().toLowerCase(); bv = (b[txSort.field]||'').toString().toLowerCase(); }
    if(av < bv) return txSort.dir==='asc' ? -1 : 1;
    if(av > bv) return txSort.dir==='asc' ? 1 : -1;
    return 0;
  });
  const arrow = f => txSort.field===f ? (txSort.dir==='asc' ? ' ▲' : ' ▼') : '';
  const header = `
    <div class="tx-row tx-header">
      <div onclick="setSort('date')">Date${arrow('date')}</div>
      <div onclick="setSort('merchant')">Merchant${arrow('merchant')}</div>
      <div onclick="setSort('category')">Category${arrow('category')}</div>
      <div onclick="setSort('amount')" style="text-align:right;">Amount${arrow('amount')}</div>
      <div></div>
    </div>
  `;
  txDiv.innerHTML = header + (indexed.length ? indexed.map(t=>`
    <div class="tx-row">
      <div class="tx-date">${t.date}</div>
      <div>${escapeHtml(t.merchant)}${t.source ? `<div class="tx-source">${escapeHtml(t.source)}</div>` : ''}</div>
      <div class="tx-cat">${t.category}</div>
      <div class="tx-amt">$${t.amount.toFixed(2)}</div>
      <button class="tx-del" onclick="deleteTx(${t._idx})" title="Delete">✕</button>
    </div>
  `).join('') : `<div class="empty-state">${activeFilter ? 'No transactions match this search.' : 'No transactions yet — import a CSV or paste text above.'}</div>`);

  const heading = document.getElementById('txHeading');
  if(heading) heading.textContent = activeFilter ? `Transactions (${indexed.length} matching)` : 'Transactions';
  const searchStatus = document.getElementById('searchStatus');
  if(searchStatus) searchStatus.textContent = activeFilter ? `Filtering the list below to: ${filterDescription(activeFilter)}` : '';

  const summarySpent = indexed.reduce((s,t)=>s+t.amount,0);
  const summaryCats = {};
  indexed.forEach(t=>{ summaryCats[t.category] = (summaryCats[t.category]||0) + t.amount; });
  const summaryContent = document.getElementById('summaryContent');
  if(summaryContent){
    summaryContent.innerHTML = `
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px;">${escapeHtml(filterDescription(activeFilter))}</div>
      <div style="font-family:var(--display);font-size:18px;font-weight:600;margin-bottom:${Object.keys(summaryCats).length ? '10px' : '0'};">Total: $${summarySpent.toFixed(2)}</div>
      ${Object.keys(summaryCats).length ? `<div style="display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-soft);">${Object.entries(summaryCats).map(([c,a])=>`<span><strong style="color:var(--ink);">${escapeHtml(c)}:</strong> $${a.toFixed(2)}</span>`).join('')}</div>` : ''}
    `;
  }
}

let txSort = { field: 'date', dir: 'desc' };
function setSort(field){
  if(txSort.field === field){
    txSort.dir = txSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    txSort.field = field;
    txSort.dir = (field === 'amount' || field === 'date') ? 'desc' : 'asc';
  }
  render();
}

const MANUAL_SOURCES = ['CSV upload', 'Pasted transactions'];
function deleteTx(i){
  const tx = state.transactions[i];
  if(tx && tx.source && !MANUAL_SOURCES.includes(tx.source)){
    const ok = confirm(`This transaction came from ${tx.source} and can't be re-downloaded by syncing again if you delete it. Delete anyway?`);
    if(!ok) return;
  }
  state.transactions.splice(i,1);
  save();
  render();
}
function clearAll(){
  if(!confirm('Remove all transactions? This cannot be undone.')) return;
  state.transactions = [];
  save();
  render();
}

function csvEscape(val){
  const s = val === null || val === undefined ? '' : String(val);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportTransactionsCSV(){
  if(!state.transactions.length) return showToast('No transactions to export');
  const header = ['Date','Merchant','Category','Amount','Source'];
  const rows = state.transactions.map(t => [
    t.date,
    csvEscape(t.merchant),
    t.category,
    t.amount.toFixed(2),
    t.source || 'Unknown'
  ]);
  const csv = [header, ...rows].map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `spend-radar-transactions-${toISO(new Date())}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`Exported ${state.transactions.length} transaction(s) to CSV`);
}

function ordinal(n){
  n = parseInt(n) || 19;
  const s=['th','st','nd','rd'], v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- transaction search ----------
let activeFilter = null;

function populateSearchFilters(){
  const catSelect = document.getElementById('searchCategory');
  const srcSelect = document.getElementById('searchSource');
  if(!catSelect || !srcSelect) return;

  const prevCat = catSelect.value;
  const prevSrc = srcSelect.value;

  const categories = [...new Set(state.transactions.map(t=>t.category).filter(Boolean))].sort();
  const sources = [...new Set(state.transactions.map(t=>t.source).filter(Boolean))].sort();

  catSelect.innerHTML = '<option value="">All categories</option>' +
    categories.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  srcSelect.innerHTML = '<option value="">All sources</option>' +
    sources.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');

  if(categories.includes(prevCat)) catSelect.value = prevCat;
  if(sources.includes(prevSrc)) srcSelect.value = prevSrc;
}

function matchesFilter(t, filter){
  if(!filter) return true;
  if(filter.from && t.date < filter.from) return false;
  if(filter.to && t.date > filter.to) return false;
  if(filter.category && t.category !== filter.category) return false;
  if(filter.source && t.source !== filter.source) return false;
  return true;
}
function filterDescription(filter){
  if(!filter) return 'All transactions';
  const parts = [];
  if(filter.from || filter.to) parts.push(`${filter.from||'any date'} to ${filter.to||'any date'}`);
  if(filter.category) parts.push(`category: ${filter.category}`);
  if(filter.source) parts.push(`via: ${filter.source}`);
  return parts.length ? parts.join(' · ') : 'All transactions';
}

function runSearch(){
  const fromRaw = document.getElementById('searchFrom').value;
  const toRaw = document.getElementById('searchTo').value;
  const category = document.getElementById('searchCategory').value;
  const source = document.getElementById('searchSource').value;

  if(fromRaw && toRaw && fromRaw > toRaw) return showToast('The "From" date has to be before the "To" date');

  const hasAnyFilter = fromRaw || toRaw || category || source;
  activeFilter = hasAnyFilter ? { from: fromRaw, to: toRaw, category, source } : null;
  render();
}
function clearSearch(){
  activeFilter = null;
  document.getElementById('searchFrom').value = '';
  document.getElementById('searchTo').value = '';
  document.getElementById('searchCategory').value = '';
  document.getElementById('searchSource').value = '';
  render();
}

function formatCurrencyInput(el){
  let v = el.value.replace(/[^0-9.]/g, '');
  const parts = v.split('.');
  if(parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
  el.value = v;
}
function formatCurrencyBlur(el){
  const num = parseFloat(el.value.replace(/,/g, ''));
  if(isNaN(num)){ el.value = ''; return; }
  el.value = num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function downloadSearchPDF(){
  const results = state.transactions.filter(t => matchesFilter(t, activeFilter));
  if(!results.length) return showToast('No transactions match to export');

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;

  doc.setFontSize(16);
  doc.text('Spend Radar', 14, y); y += 8;
  doc.setFontSize(10);
  doc.setTextColor(120);
  doc.text(filterDescription(activeFilter), 14, y); y += 10;
  doc.setTextColor(0);

  const spent = results.reduce((s,t)=>s+t.amount,0);
  doc.setFontSize(12);
  doc.text(`Total: $${spent.toFixed(2)}`, 14, y); y += 8;

  const limitRaw = document.getElementById('pdfLimit').value.trim().replace(/,/g, '');
  if(limitRaw !== ''){
    const limitVal = parseFloat(limitRaw);
    if(!isNaN(limitVal)){
      const remaining = limitVal - spent;
      doc.setFontSize(12);
      doc.setTextColor(remaining < 0 ? 199 : 31, remaining < 0 ? 71 : 111, remaining < 0 ? 63 : 107);
      doc.text(`Remaining (limit $${limitVal.toFixed(2)}): $${remaining.toFixed(2)}${remaining < 0 ? ' over' : ''}`, 14, y);
      doc.setTextColor(0);
      y += 8;
    }
  }

  const cats = {};
  results.forEach(t=>{ cats[t.category] = (cats[t.category]||0) + t.amount; });
  if(Object.keys(cats).length > 1){
    doc.setFontSize(9);
    doc.setTextColor(90);
    const catLine = Object.entries(cats).map(([c,a])=>`${c}: $${a.toFixed(2)}`).join('    ·    ');
    doc.text(catLine, 14, y); y += 8;
    doc.setTextColor(0);
  }

  const sorted = [...results].sort((a,b)=> a.date < b.date ? 1 : -1);
  const body = sorted.map(t => [t.date, t.merchant, t.category, t.source || '', `$${t.amount.toFixed(2)}`]);

  doc.autoTable({
    head: [['Date', 'Merchant', 'Category', 'Source', 'Amount']],
    body: body,
    startY: y + 2,
    styles: { fontSize: 8, cellPadding: 1.5 },
    headStyles: { fillColor: false, textColor: [31, 111, 107], fontStyle: 'bold', fontSize: 11 },
    columnStyles: { 4: { halign: 'right' } },
    alternateRowStyles: { fillColor: [246, 248, 251] }
  });

  doc.save(`spend-radar-${toISO(new Date())}.pdf`);
  showToast(`Downloaded PDF with ${results.length} transaction(s)`);
}

// ---------- toast ----------
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

initApp();
async function initApp(){
  if(state.appSecret){
    await pullStateFromServer();
  }
  render();
  checkBankStatus();
}

async function checkBankStatus(){
  if(!state.appSecret) return;
  try{
    const res = await fetch('/api/bank-status', {
      method:'GET',
      headers:{ 'x-app-secret': state.appSecret }
    });
    if(!res.ok) return;
    const { connected } = await res.json();
    if(connected){
      state.bankLinked = true;
      save();
      renderConnectionCard();
      syncBankTransactions();
    }
  }catch(err){
    console.error(err);
  }
}
</script>
